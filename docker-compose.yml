services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: school-erp-postgres
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-school_erp}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8"
    ports:
      - "5435:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-school_erp}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - school-erp-network

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: school-erp-redis
    ports:
      - "${REDIS_PORT:-6380}:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - school-erp-network

  # NATS Message Broker
  nats:
    image: nats:2.10-alpine
    container_name: school-erp-nats
    ports:
      - "${NATS_PORT:-4223}:4222"
      - "8223:8222"  # Management port
    command: -js -sd /data
    volumes:
      - nats_data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 4222 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - school-erp-network

  # Auth Service
  auth-service:
    build:
      context: ./services/auth
      dockerfile: Dockerfile
      args:
        - GOPROXY=https://proxy.golang.org,direct
    container_name: school-erp-auth
    expose:
      - "3001"
    environment:
      DATABASE_URL: postgres://${DB_USER:-postgres}:${DB_PASSWORD:-postgres}@postgres:5432/${DB_NAME:-school_erp}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      DB_NAME: ${DB_NAME:-school_erp}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      REFRESH_TOKEN_SECRET: ${REFRESH_TOKEN_SECRET:?REFRESH_TOKEN_SECRET is required}
      SUPER_ADMIN_EMAIL: ${SUPER_ADMIN_EMAIL}
      SUPER_ADMIN_PASSWORD: ${SUPER_ADMIN_PASSWORD}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?ENCRYPTION_KEY is required}
      CORS_ALLOW_ORIGINS: http://localhost:3000,http://localhost:3001
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - school-erp-network
    mem_limit: 512m
    cpus: "0.5"
    restart: on-failure

  # User Service
  user-service:
    build:
      context: ./services/user
      dockerfile: Dockerfile
      args:
        - GOPROXY=https://proxy.golang.org,direct
    container_name: school-erp-user
    expose:
      - "3002"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      DB_NAME: ${DB_NAME:-school_erp}
      NATS_URL: nats://nats:4222
      REDIS_URL: redis://redis:6379
      CORS_ALLOW_ORIGINS: http://localhost:3000,http://localhost:3001
      AUTH_SERVICE_URL: http://auth-service:3001
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?ENCRYPTION_KEY is required}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - school-erp-network
    mem_limit: 512m
    cpus: "0.5"
    restart: on-failure

  # Student Service
  student-service:
    build:
      context: ./services/student
      dockerfile: Dockerfile
      args:
        - GOPROXY=https://proxy.golang.org,direct
    container_name: school-erp-student
    expose:
      - "3003"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      DB_NAME: ${DB_NAME:-school_erp}
      NATS_URL: nats://nats:4222
      REDIS_URL: redis://redis:6379
      CORS_ALLOW_ORIGINS: http://localhost:3000,http://localhost:3001
      AUTH_SERVICE_URL: http://auth-service:3001
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?ENCRYPTION_KEY is required}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - school-erp-network
    mem_limit: 512m
    cpus: "0.5"
    restart: on-failure

  # Attendance Service
  attendance-service:
    build:
      context: ./services/attendance
      dockerfile: Dockerfile
      args:
        - GOPROXY=https://proxy.golang.org,direct
    container_name: school-erp-attendance
    expose:
      - "3004"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      DB_NAME: ${DB_NAME:-school_erp}
      NATS_URL: nats://nats:4222
      REDIS_URL: redis://redis:6379
      ENV: development
      LOG_LEVEL: debug
      CORS_ALLOW_ORIGINS: http://localhost:3000,http://localhost:3001
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?ENCRYPTION_KEY is required}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - school-erp-network
    restart: on-failure

  # Fee Service
  fee-service:
    build:
      context: ./services/fee
      dockerfile: Dockerfile
      args:
        - GOPROXY=https://proxy.golang.org,direct
    container_name: school-erp-fee
    expose:
      - "3005"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      DB_NAME: ${DB_NAME:-school_erp}
      NATS_URL: nats://nats:4222
      REDIS_URL: redis://redis:6379
      CORS_ALLOW_ORIGINS: http://localhost:3000,http://localhost:3001
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - school-erp-network
    restart: on-failure

  # Exam Service
  exam-service:
    build:
      context: ./services/exam
      dockerfile: Dockerfile
      args:
        - GOPROXY=https://proxy.golang.org,direct
    container_name: school-erp-exam
    expose:
      - "3006"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      DB_NAME: ${DB_NAME:-school_erp}
      NATS_URL: nats://nats:4222
      REDIS_URL: redis://redis:6379
      CORS_ALLOW_ORIGINS: http://localhost:3000,http://localhost:3001
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - school-erp-network
    restart: on-failure

  # Notification Service
  notification-service:
    build:
      context: ./services/notification
      dockerfile: Dockerfile
      args:
        - GOPROXY=https://proxy.golang.org,direct
    container_name: school-erp-notification
    expose:
      - "3007"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      DB_NAME: ${DB_NAME:-school_erp}
      NATS_URL: nats://nats:4222
      REDIS_URL: redis://redis:6379
      CORS_ALLOW_ORIGINS: http://localhost:3000,http://localhost:3001
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - school-erp-network
    restart: on-failure

  # Website Service
  website-service:
    build:
      context: ./services/website
      dockerfile: Dockerfile
      args:
        - GOPROXY=https://proxy.golang.org,direct
    container_name: school-erp-website
    expose:
      - "3013"
    environment:
      WEBSITE_SERVICE_PORT: 3013
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      DB_NAME: ${DB_NAME:-school_erp}
      NATS_URL: nats://nats:4222
      REDIS_URL: redis://redis:6379
      CORS_ALLOW_ORIGINS: http://localhost:3000,http://localhost:3001
      OPENAI_API_KEY: ${OPENAI_API_KEY:?OPENAI_API_KEY is required}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - school-erp-network
    restart: on-failure

  # Real-time Service
  realtime-service:
    build:
      context: ./services/realtime
      dockerfile: Dockerfile
      args:
        - GOPROXY=https://proxy.golang.org,direct
    container_name: school-erp-realtime
    expose:
      - "3008"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      DB_NAME: ${DB_NAME:-school_erp}
      NATS_URL: nats://nats:4222
      REDIS_URL: redis://redis:6379
      CORS_ALLOW_ORIGINS: http://localhost:3000,http://localhost:3001
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy
    networks:
      - school-erp-network
    restart: on-failure

  # School Service
  school-service:
    build:
      context: ./services/school
      dockerfile: Dockerfile
      args:
        - GOPROXY=https://proxy.golang.org,direct
    container_name: school-erp-school
    expose:
      - "3011"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      DB_NAME: ${DB_NAME:-school_erp}
      NATS_URL: nats://nats:4222
      REDIS_URL: redis://redis:6379
      CORS_ALLOW_ORIGINS: http://localhost:3000,http://localhost:3001
      PORT: 3011
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?ENCRYPTION_KEY is required}
    volumes:
      - school_uploads:/root/uploads
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy
    networks:
      - school-erp-network
    restart: on-failure

  # Expense Service
  expense-service:
    build:
      context: ./services/expense
      dockerfile: Dockerfile
      args:
        - GOPROXY=https://proxy.golang.org,direct
    container_name: school-erp-expense
    expose:
      - "3010"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      DB_NAME: ${DB_NAME:-school_erp}
      NATS_URL: nats://nats:4222
      REDIS_URL: redis://redis:6379
      CORS_ALLOW_ORIGINS: http://localhost:3000,http://localhost:3001
      PORT: 3010
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?ENCRYPTION_KEY is required}
    volumes:
      - expense_uploads:/root/uploads
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy
    networks:
      - school-erp-network
    mem_limit: 512m
    cpus: "0.5"
    restart: on-failure

  # Transport Service
  transport-service:
    build:
      context: ./services/transport
      dockerfile: Dockerfile
      args:
        - GOPROXY=https://proxy.golang.org,direct
    container_name: school-erp-transport
    expose:
      - "3009"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      DB_NAME: ${DB_NAME:-school_erp}
      NATS_URL: nats://nats:4222
      REDIS_URL: redis://redis:6379
      CORS_ALLOW_ORIGINS: http://localhost:3000,http://localhost:3001
      PORT: 3009
      TRACCAR_API_URL: ${TRACCAR_API_URL:-https://system.geotrack.com.np/api}
      TRACCAR_USER: ${TRACCAR_USER}
      TRACCAR_PASSWORD: ${TRACCAR_PASSWORD:?TRACCAR_PASSWORD is required}
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy
    networks:
      - school-erp-network
    restart: on-failure

  # Payroll Service
  payroll-service:
    build:
      context: ./services/payroll
      dockerfile: Dockerfile
      args:
        - GOPROXY=https://proxy.golang.org,direct
    container_name: school-erp-payroll
    expose:
      - "3012"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      DB_NAME: ${DB_NAME:-school_erp}
      NATS_URL: nats://nats:4222
      REDIS_URL: redis://redis:6379
      CORS_ALLOW_ORIGINS: http://localhost:3000,http://localhost:3001
      PORT: 3012
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy
    networks:
      - school-erp-network
    restart: on-failure

  # Accounting Service
  accounting-service:
    build:
      context: ./services/accounting
      dockerfile: Dockerfile
      args:
        - GOPROXY=https://proxy.golang.org,direct
    container_name: school-erp-accounting
    expose:
      - "8009"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      DB_NAME: ${DB_NAME:-school_erp}
      NATS_URL: nats://nats:4222
      REDIS_URL: redis://redis:6379
      CORS_ALLOW_ORIGINS: http://localhost:3000,http://localhost:3001
      PORT: 8009
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy
    networks:
      - school-erp-network
    restart: on-failure

  # Communication Service
  communication-service:
    build:
      context: ./services/communication
      dockerfile: Dockerfile
      args:
        - GOPROXY=https://proxy.golang.org,direct
    container_name: school-erp-communication
    expose:
      - "8005"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      DB_NAME: ${DB_NAME:-school_erp}
      NATS_URL: nats://nats:4222
      REDIS_URL: redis://redis:6379
      CORS_ALLOW_ORIGINS: http://localhost:3000,http://localhost:3001
      PORT: 8005
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy
    networks:
      - school-erp-network
    restart: on-failure

  # Class Service
  class-service:
    build:
      context: ./services/class
      dockerfile: Dockerfile
      args:
        - GOPROXY=https://proxy.golang.org,direct
    container_name: school-erp-class
    expose:
      - "3014"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      DB_NAME: ${DB_NAME:-school_erp}
      NATS_URL: nats://nats:4222
      REDIS_URL: redis://redis:6379
      CORS_ALLOW_ORIGINS: http://localhost:3000,http://localhost:3001
      PORT: 3014
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?ENCRYPTION_KEY is required}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - school-erp-network
    restart: on-failure

  # Library Service
  library-service:
    build:
      context: ./services/library
      dockerfile: Dockerfile
      args:
        - GOPROXY=https://proxy.golang.org,direct
    container_name: school-erp-library
    expose:
      - "3015"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      DB_NAME: ${DB_NAME:-school_erp}
      NATS_URL: nats://nats:4222
      REDIS_URL: redis://redis:6379
      CORS_ALLOW_ORIGINS: http://localhost:3000,http://localhost:3001
      LIBRARY_SERVICE_PORT: 3015
      AUTH_SERVICE_URL: http://auth-service:3001
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?ENCRYPTION_KEY is required}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - school-erp-network
    restart: on-failure

  # Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:8081}
    container_name: school-erp-frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:8081}
      - HOSTNAME=0.0.0.0
    depends_on:
      - nginx
    networks:
      - school-erp-network
    mem_limit: 512m
    cpus: "0.5"
    restart: on-failure
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # API Gateway
  nginx:
    image: nginx:alpine
    container_name: school-erp-gateway
    ports:
      - "8081:80"
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - auth-service
      - user-service
      - student-service
      - school-service
    networks:
      - school-erp-network
    mem_limit: 512m
    cpus: "0.5"

  # ---------------------------------------------------------------------------
  # Observability Stack
  # ---------------------------------------------------------------------------

  # Loki - Log Aggregation
  loki:
    image: grafana/loki:latest
    container_name: loki
    ports:
      - "3100:3100"
    command: -config.file=/etc/loki/loki-config.yaml
    volumes:
      - ./infra/monitoring/loki/loki-config.yaml:/etc/loki/loki-config.yaml
    networks:
      - school-erp-network

  # Promtail - Log Shipper
  promtail:
    image: grafana/promtail:latest
    container_name: promtail
    volumes:
      - ./infra/monitoring/promtail/promtail-config.yaml:/etc/promtail/promtail-config.yaml
      - /var/lib/docker/containers:/var/lib/docker/containers
      - /var/run/docker.sock:/var/run/docker.sock
    command: -config.file=/etc/promtail/promtail-config.yaml
    networks:
      - school-erp-network

  # Prometheus - Metrics
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./infra/monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
    networks:
      - school-erp-network

  # cAdvisor - Container Metrics
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: cadvisor
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    networks:
      - school-erp-network
    mem_limit: 256m
    cpus: "0.25"

  # Grafana - Visualization
  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3030:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:?required}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./infra/monitoring/grafana/provisioning:/etc/grafana/provisioning
    networks:
      - school-erp-network

volumes:
  postgres_data:
  redis_data:
  nats_data:
  school_uploads:
  expense_uploads:

networks:
  school-erp-network:
    driver: bridge
