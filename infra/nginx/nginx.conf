events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    # Docker DNS resolver
    resolver 127.0.0.11 valid=30s;

    # CORS Origin Map
    map $http_origin $cors_origin {
        default "";
        "http://localhost:3000" $http_origin;
        "http://localhost:3001" $http_origin;
        # Add more origins here as needed
    }


    server {
        listen 80;
        server_name localhost;

        # Hide CORS headers from upstream services to avoid duplicates
        proxy_hide_header Access-Control-Allow-Origin;
        proxy_hide_header Access-Control-Allow-Methods;
        proxy_hide_header Access-Control-Allow-Headers;
        proxy_hide_header Access-Control-Allow-Credentials;
        proxy_hide_header Access-Control-Max-Age;

        # Shared CORS variables
        set $cors_methods "GET, POST, PUT, DELETE, PATCH, OPTIONS";
        set $cors_headers "Authorization, Content-Type, X-Tenant-Code, X-Requested-With";

        # Global CORS Handling
        add_header 'Access-Control-Allow-Origin' $cors_origin always;
        add_header 'Access-Control-Allow-Methods' $cors_methods always;
        add_header 'Access-Control-Allow-Headers' $cors_headers always;
        add_header 'Access-Control-Allow-Credentials' 'true' always;
        add_header 'Access-Control-Max-Age' '7200' always;

        # Global Preflight Handler
        if ($request_method = 'OPTIONS') {
            return 204;
        }

        # Service Routing
        location /api/v1/auth {
            set $upstream_auth auth-service:3001;
            proxy_pass http://$upstream_auth;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /api/v1/users {
            set $upstream_user user-service:3002;
            proxy_pass http://$upstream_user;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
        
        location /api/v1/teachers {
            set $upstream_user user-service:3002;
            proxy_pass http://$upstream_user;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /api/v1/guardians {
            set $upstream_user user-service:3002;
            proxy_pass http://$upstream_user;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /api/v1/students {
            set $upstream_student student-service:3003;
            proxy_pass http://$upstream_student;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /api/v1/schools {
            set $upstream_school school-service:3011;
            proxy_pass http://$upstream_school;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /api/v1/attendance {
            set $upstream_attendance attendance-service:3004;
            proxy_pass http://$upstream_attendance;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /api/v1/fees {
            set $upstream_fee fee-service:3005;
            proxy_pass http://$upstream_fee;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /api/v1/exams {
            set $upstream_exam exam-service:3006;
            proxy_pass http://$upstream_exam;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /api/v1/notifications {
            set $upstream_notification notification-service:3007;
            proxy_pass http://$upstream_notification;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /api/v1/transport {
            set $upstream_transport transport-service:3009;
            proxy_pass http://$upstream_transport;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /api/v1/expenses {
            set $upstream_expense expense-service:3010;
            proxy_pass http://$upstream_expense;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /api/v1/payroll {
            set $upstream_payroll payroll-service:3012;
            proxy_pass http://$upstream_payroll;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /api/v1/classes {
            set $upstream_class class-service:3014;
            proxy_pass http://$upstream_class;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /api/v1/library {
            set $upstream_library library-service:3015;
            proxy_pass http://$upstream_library;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /api/v1/accounting {
            set $upstream_acc accounting-service:8009;
            proxy_pass http://$upstream_acc;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /api/v1/staff {
            set $upstream_user user-service:3002;
            proxy_pass http://$upstream_user;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /api/v1/departments {
            set $upstream_user user-service:3002;
            proxy_pass http://$upstream_user;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Realtime service (WebSockets)
        location /socket.io/ {
            set $upstream_realtime realtime-service:3008;
            proxy_pass http://$upstream_realtime/socket.io/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
        }

        location /health {
            return 200 '{"status":"healthy","service":"gateway"}';
            add_header Content-Type application/json;
        }

        # Website Service (Public website)
        location / {
            set $upstream_website website-service:3013;
            proxy_pass http://$upstream_website/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
}
